services:
  postgres:
    image: postgres:16-alpine
    container_name: karhutla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-threads_karhutla}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threads_karhutla"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
